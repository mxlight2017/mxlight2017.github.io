<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>月がとても美しい</title>
<style>
:root{
  --primary:#0077b6;--bg:#FEF7FF;--surface:#F7F2FA;--surface2:#F3EDF7;
  --text:#1D1B20;--muted:#49454F;--outline:#CAC4D0;
}
[data-theme="dark"]{
  --primary:#D0BCFF;--bg:#141218;--surface:#1D1B20;--surface2:#211F26;
  --text:#E6E0E9;--muted:#CAC4D0;--outline:#49454F;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,system-ui,sans-serif}
body{line-height:1.75}
.topbar{
  position:sticky;top:0;z-index:2;height:64px;padding:0 18px;
  display:flex;align-items:center;gap:12px;background:var(--surface2);
  border-bottom:1px solid var(--outline)
}
.logo{color:var(--primary);font-size:25px}
.title{flex:1;font-size:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{
  width:44px;height:44px;border:0;border-radius:50%;background:transparent;
  color:var(--muted);font-size:22px;cursor:pointer
}
main{max-width:860px;margin:0 auto;padding:28px 16px 64px}
.card{
  overflow:hidden;background:var(--surface);border-radius:28px;
  box-shadow:0 1px 3px rgba(0,0,0,.18)
}
.header{padding:30px 30px 20px;border-bottom:1px solid var(--outline)}
h1{margin:0 0 8px;font-size:32px;line-height:1.3;font-weight:500}
.meta{font-size:13px;color:var(--muted)}
.article{padding:8px 30px 36px}
.article h1{font-size:1.8em;margin:1em 0 .4em}
.article h2{font-size:1.4em;margin:1em 0 .4em;padding-bottom:.25em;border-bottom:1px solid var(--outline)}
.article h3{font-size:1.2em;margin:1em 0 .35em}
.article p{margin:.75em 0}
.article ul,.article ol{padding-left:1.5em}
.article blockquote{margin:1em 0;padding:8px 14px;border-left:4px solid var(--primary);background:var(--surface2);color:var(--muted)}
.article code{background:var(--surface2);padding:.12em .35em;border-radius:4px}
.article pre{padding:14px;overflow:auto;border-radius:12px;background:var(--surface2)}
.article pre code{padding:0;background:transparent}
.article a{color:var(--primary)}
.article img{max-width:100%;border-radius:12px}
.article table{width:100%;border-collapse:collapse}
.article th,.article td{padding:8px 10px;border:1px solid var(--outline);text-align:left}
.article th{background:var(--surface2)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}
@media(max-width:600px){
  main{padding:16px 10px 40px}
  .header,.article{padding-left:20px;padding-right:20px}
  h1{font-size:26px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">✎</div>
  <div class="title" aria-hidden="true"></div>
  <button id="themeBtn" aria-label="☾">☾</button>
</header>
<main>
  <article class="card">
    <header class="header">
      <h1>月がとても美しい</h1>
    </header>
    <div class="article"><p>月がとても美しい。</p>
<p>日语中“月“的发音是Tsuki<br>而“喜欢”的发音是Suki。</p>
</div>
  </article>
</main>
<script>
const root=document.documentElement;
const btn=document.getElementById("themeBtn");
function setTheme(theme){
  root.setAttribute("data-theme",theme);
  btn.textContent=theme==="dark"?"☀":"☾";
  try{localStorage.setItem("md3-export-theme",theme)}catch(e){}
}
let theme="dark";
try{
  const saved=localStorage.getItem("md3-export-theme");
  if(saved) theme=saved;
}catch(e){}
setTheme(theme);
btn.addEventListener("click",()=>setTheme(root.getAttribute("data-theme")==="dark"?"light":"dark"));
</script>
</body>
</html>
