<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F2FA" />
  <title>✎</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --primary: #6750A4;
      --on-primary: #FFFFFF;
      --primary-container: #EADDFF;
      --on-primary-container: #21005D;
      --secondary-container: #E8DEF8;
      --on-secondary-container: #1D192B;
      --error: #B3261E;
      --background: #FEF7FF;
      --on-background: #1D1B20;
      --surface: #FEF7FF;
      --on-surface: #1D1B20;
      --surface-low: #F7F2FA;
      --surface-container: #F3EDF7;
      --surface-high: #ECE6F0;
      --surface-highest: #E6E0E9;
      --on-surface-variant: #49454F;
      --outline: #79747E;
      --outline-variant: #CAC4D0;
      --shadow: rgba(0,0,0,.18);
      --md3-primary-fixed: #EADDFF;
      --md3-on-primary-fixed: #21005D;
      --md3-primary-fixed-dim: #D0BCFF;
      --md3-surface-tint: #6750A4;
      --md3-on-primary: #FFFFFF;
      --md3-on-primary-container: #21005D;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 28px;
      --radius-full: 999px;

      --header-h: 64px;
      --sidebar-w: 310px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --primary: #D0BCFF;
      --on-primary: #381E72;
      --primary-container: #4F378B;
      --on-primary-container: #EADDFF;
      --secondary-container: #4A4458;
      --on-secondary-container: #E8DEF8;
      --error: #F2B8B5;
      --background: #141218;
      --on-background: #E6E0E9;
      --surface: #141218;
      --on-surface: #E6E0E9;
      --surface-low: #1D1B20;
      --surface-container: #211F26;
      --surface-high: #2B2930;
      --surface-highest: #36343B;
      --on-surface-variant: #CAC4D0;
      --outline: #938F99;
      --outline-variant: #49454F;
      --shadow: rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--background);
      color: var(--on-background);
      font-family: Roboto, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      padding-top: var(--safe-top);
      display: flex;
      flex-direction: column;
    }

    button, input, textarea { font: inherit; }

    button { -webkit-appearance: none; }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      user-select: none;
    }

    .topbar {
      height: var(--header-h);
      min-height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px 0 6px;
      background: var(--surface-container);
      border-bottom: 1px solid var(--outline-variant);
      z-index: 50;
    }

    .brand-icon {
      color: var(--primary);
      font-size: 28px;
      flex: 0 0 auto;
    }

    .brand {
      min-width: 0;
      font-size: 20px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spacer { flex: 1; }

    .icon-btn {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--on-surface-variant);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: background .15s, transform .08s;
    }

    .icon-btn:hover {
      background: color-mix(in srgb, var(--on-surface) 8%, transparent);
    }

    .icon-btn:active { transform: scale(.94); }

    .main {
      min-height: 0;
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      background: var(--surface-low);
      border-right: 1px solid var(--outline-variant);
      z-index: 40;
    }

    .sidebar-head {
      position: relative;
      min-height: 64px;
      padding: 12px 64px 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    /* 新建按钮固定在笔记栏右上角，避免移动端被挤掉 */
    #newNoteBtn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 48px !important;
      height: 48px !important;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      color: var(--on-primary);
      background: var(--primary);
      z-index: 100;
      box-shadow: 0 2px 8px var(--shadow);
    }

    #newNoteBtn:focus-visible, #colorToggle:focus-visible, #themeToggle:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 42%, transparent);
      outline-offset: 2px;
    }

    #newNoteBtn:hover {
      background: var(--primary);
      filter: brightness(.96);
    }

    #newNoteBtn .material-symbols-outlined {
      display: inline-block !important;
      visibility: visible !important;
      opacity: 1 !important;
      line-height: 1;
    }

    #newNoteBtn .material-symbols-outlined {
      font-size: 26px;
    }

    /* MD3：颜色方案面板。使用 surface-container + outline-variant + full-radius 控件。 */
    .color-panel {
      position: fixed;
      top: calc(var(--safe-top) + var(--header-h) + 8px);
      right: 12px;
      width: min(336px, calc(100vw - 24px));
      padding: 8px;
      border: 1px solid var(--outline-variant);
      border-radius: 28px;
      background: var(--surface-container);
      color: var(--on-surface);
      box-shadow: 0 8px 24px var(--shadow);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(.98);
      transform-origin: top right;
      transition: opacity .18s ease, transform .18s ease, visibility .18s;
    }

    .color-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .color-panel-title {
      min-height: 48px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .color-panel-section {
      padding: 8px;
    }

    .color-swatches {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .color-swatch {
      min-width: 0;
      height: 48px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 16px;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
      transition: transform .12s ease, border-color .12s ease;
    }

    .color-swatch:active { transform: scale(.95); }

    .color-swatch.active {
      border-color: var(--on-surface);
      box-shadow: inset 0 0 0 3px var(--surface-container);
    }


    .custom-color-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #customColor {
      width: 52px;
      height: 48px;
      padding: 3px;
      border: 1px solid var(--outline);
      border-radius: 16px;
      background: var(--surface-high);
      cursor: pointer;
    }

    .color-reset {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      padding: 0;
      border: 1px solid var(--outline);
      border-radius: 50%;
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      display: inline-grid;
      place-items: center;
    }

    .color-reset:hover {
      background: color-mix(in srgb, var(--primary) 8%, transparent);
    }


    .sidebar-title {
      width: 28px;
      height: 28px;
      display: inline-grid;
      place-items: center;
      color: var(--on-surface-variant);
      font-size: 22px;
      opacity: .82;
    }

    .folder-bar {
      display:flex;
      align-items:center;
      gap:4px;
      padding:4px 8px 2px;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .folder-bar::-webkit-scrollbar { display:none; }
    .folder-item {
      flex:0 0 auto;
      width:44px; height:44px;
      border:0; border-radius:var(--radius-full);
      background:transparent; color:var(--on-surface-variant);
      display:inline-flex; align-items:center; justify-content:center;
      cursor:pointer;
    }
    .folder-item.active {
      background:var(--secondary-container);
      color:var(--on-secondary-container);
    }
    .folder-item.drag-over {
      background:var(--primary-container);
      color:var(--on-primary-container);
      transform:scale(1.06);
    }
    .folder-item:hover { background:color-mix(in srgb,var(--on-surface) 7%,transparent); }
    .folder-item.add { color:var(--primary); }
    .folder-item.delete { color:var(--error); }
    .folder-item .material-symbols-outlined { font-size:22px; }
    .folder-divider { height:1px; margin:2px 16px 4px; background:var(--outline-variant); }
    @media (max-width:767px) {
      .folder-bar { padding-top:2px; }
    }
    .move-panel {
      position:fixed;
      top:calc(var(--topbar-h) + 8px);
      right:12px;
      z-index:60;
      display:none;
      flex-direction:column;
      gap:4px;
      min-width:180px;
      max-width:calc(100vw - 24px);
      padding:8px;
      background:var(--surface-container);
      color:var(--on-surface);
      border:1px solid var(--outline-variant);
      border-radius:24px;
      box-shadow:var(--elevation-2);
    }
    .move-panel.open { display:flex; }
    .move-option {
      border:0;
      background:transparent;
      color:var(--on-surface);
      min-height:44px;
      padding:0 12px;
      border-radius:16px;
      display:flex;
      align-items:center;
      gap:12px;
      cursor:pointer;
      text-align:left;
    }
    .move-option:hover { background:color-mix(in srgb,var(--on-surface) 7%,transparent); }
    .move-option.active { background:var(--secondary-container); color:var(--on-secondary-container); }
    .move-option .material-symbols-outlined { font-size:22px; }

    .search-wrap {
      padding: 4px 10px 10px;
    }

    .search-box {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-radius: var(--radius-full);
      background: var(--surface-container);
      color: var(--on-surface-variant);
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--on-surface);
      font-size: 14px;
    }

    .notes-list {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding: 2px 8px calc(16px + var(--safe-bottom));
      overscroll-behavior: contain;
    }

    .note-item {
      min-height: 58px;
      margin: 2px 0;
      padding: 8px 8px 8px 14px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--on-surface);
      cursor: pointer;
      transition: background .15s;
    }

    .note-item:hover {
      background: color-mix(in srgb, var(--on-surface) 6%, transparent);
    }

    .note-item.active {
      background: var(--secondary-container);
      color: var(--on-secondary-container);
    }

    .note-main {
      min-width: 0;
      flex: 1;
    }

    .note-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-time {
      margin-top: 2px;
      font-size: 11px;
      color: var(--on-surface-variant);
      white-space: nowrap;
    }

    .delete-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: var(--radius-full);
      background: transparent;
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: .55;
      cursor: pointer;
    }

    .delete-btn:hover {
      opacity: 1;
      color: var(--error);
      background: color-mix(in srgb, var(--error) 10%, transparent);
    }

    .empty-list {
      padding: 42px 20px;
      text-align: center;
      color: var(--on-surface-variant);
      line-height: 1;
      opacity: .55;
    }

    .empty-list .material-symbols-outlined {
      font-size: 28px;
    }

    .editor-area {
      min-width: 0;
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      color: var(--on-surface-variant);
    }

    .empty-state .material-symbols-outlined {
      font-size: 68px;
      opacity: .45;
    }

    .empty-state button {
      width: 56px;
      height: 56px;
      padding: 0;
      border: 0;
      border-radius: var(--radius-full);
      background: var(--primary);
      color: var(--on-primary);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 3px 10px var(--shadow);
    }

    .empty-state button .material-symbols-outlined {
      font-size: 28px;
    }

    #editorContent {
      min-height: 0;
      flex: 1;
      display: none;
      flex-direction: column;
    }

    .editor-toolbar {
      height: 56px;
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 8px 0 12px;
      background: var(--surface-container);
      border-bottom: 1px solid var(--outline-variant);
    }

    .title-input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 9px 10px;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--on-surface);
      font-size: 16px;
      font-weight: 500;
    }

    .title-input:focus {
      background: var(--surface-high);
    }

    .save-status {
      padding: 0 8px;
      color: var(--on-surface-variant);
      font-size: 18px;
      white-space: nowrap;
      opacity: .8;
    }

    .mode-switcher {
      display: none;
      gap: 4px;
      padding: 6px 8px 8px;
      background: var(--surface-container);
      border-bottom: 1px solid var(--outline-variant);
    }

    .mode-btn {
      flex: 1;
      height: 38px;
      border: 0;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--on-surface-variant);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .mode-btn.active {
      background: var(--secondary-container);
      color: var(--on-secondary-container);
    }

    .panes {
      min-height: 0;
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .pane-label {
      min-height: 36px;
      padding: 5px 16px;
      background: var(--surface-low);
      border-bottom: 1px solid var(--outline-variant);
      color: var(--on-surface-variant);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
    }

    #editor {
      min-width: 0;
      min-height: 0;
      flex: 1;
      width: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 20px 24px;
      background: var(--surface);
      color: var(--on-surface);
      font-family: "Roboto Mono", monospace;
      font-size: 14px;
      line-height: 1.75;
      tab-size: 2;
      overscroll-behavior: contain;
    }

    #preview {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px 40px;
      background: var(--surface);
      color: var(--on-surface);
      line-height: 1.75;
      overscroll-behavior: contain;
    }

    .divider {
      width: 1px;
      background: var(--outline-variant);
      flex: 0 0 1px;
    }

    #preview > :first-child { margin-top: 0; }
    #preview h1 { margin: .65em 0 .4em; font-size: 1.8em; font-weight: 500; line-height: 1.3; }
    #preview h2 { margin: 1em 0 .45em; padding-bottom: .25em; font-size: 1.4em; font-weight: 500; border-bottom: 1px solid var(--outline-variant); line-height: 1.35; }
    #preview h3 { margin: 1em 0 .4em; font-size: 1.2em; font-weight: 500; }
    #preview h4, #preview h5, #preview h6 { margin: .9em 0 .35em; font-weight: 500; }
    #preview p { margin: .75em 0; }
    #preview ul, #preview ol { margin: .75em 0; padding-left: 1.45em; }
    #preview li { margin: .25em 0; }
    #preview blockquote {
      margin: 1em 0;
      padding: 8px 14px;
      border-left: 4px solid var(--primary);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: var(--surface-low);
      color: var(--on-surface-variant);
    }
    #preview code {
      padding: .12em .35em;
      border-radius: 4px;
      background: var(--surface-high);
      font-family: "Roboto Mono", monospace;
      font-size: .9em;
    }
    #preview pre {
      margin: 1em 0;
      padding: 14px;
      overflow-x: auto;
      border-radius: var(--radius-md);
      background: var(--surface-high);
    }
    #preview pre code { padding: 0; background: transparent; }
    #preview a { color: var(--primary); font-weight: 500; text-decoration: none; }
    #preview a:hover { text-decoration: underline; }
    #preview img { max-width: 100%; height: auto; border-radius: var(--radius-md); }
    #preview hr { border: 0; border-top: 1px solid var(--outline-variant); margin: 1.7em 0; }
    #preview table { width: 100%; margin: 1em 0; border-collapse: collapse; overflow: hidden; }
    #preview th, #preview td { padding: 8px 10px; border: 1px solid var(--outline-variant); text-align: left; }
    #preview th { background: var(--surface-container); font-weight: 500; }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 35;
      background: rgba(0,0,0,.4);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + var(--safe-bottom));
      z-index: 100;
      transform: translate(-50%, 20px);
      padding: 10px 16px;
      border-radius: var(--radius-full);
      background: #322F35;
      color: #F5EFF7;
      font-size: 13px;
      box-shadow: 0 4px 14px var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background: var(--outline-variant);
    }
    ::-webkit-scrollbar-track { background: transparent; }

    @media (min-width: 768px) {
      .menu-btn { display: none; }
      .mobile-only { display: none !important; }
      .pane-label { display: block; }
    }

    @media (max-width: 767px) {
      .topbar { height: 56px; min-height: 56px; }
      .brand { display: none; }
      .brand-icon { font-size: 27px; }

      .sidebar {
        position: fixed;
        left: 0;
        top: calc(var(--safe-top) + var(--header-h));
        bottom: 0;
        height: auto;
        transform: translateX(-102%);
        box-shadow: 0 8px 24px rgba(0,0,0,.28);
        transition: transform .25s cubic-bezier(.2,0,0,1);
      }

      .sidebar-head {
        min-height: 64px !important;
        height: 64px !important;
        display: flex !important;
        flex: 0 0 64px !important;
      }

      #newNoteBtn {
        position: absolute !important;
        top: 8px !important;
        right: 8px !important;
        display: inline-flex !important;
        visibility: visible !important;
        opacity: 1 !important;
      }

      .sidebar.open { transform: translateX(0); }
      .overlay.show { display: block; }

      .desktop-only { display: none !important; }
      .mode-switcher { display: flex; }
      .pane-label, .divider { display: none; }

      .panes .pane:first-child { display: flex; }
      .panes .pane:last-child { display: none; }

      body.preview-mode .panes .pane:first-child { display: none; }
      body.preview-mode .panes .pane:last-child { display: flex; }

      #editor { padding: 16px; font-size: 14px; }
      #preview { padding: 16px 18px calc(32px + var(--safe-bottom)); }

      .save-status { display: none; }
      .mobile-only { display: inline-flex; }
    }

    @media (max-width: 767px) {
      .topbar { gap: 2px; }
      .topbar .spacer { min-width: 0; }
      .topbar #colorToggle, .topbar #themeToggle { width: 46px; height: 46px; }

      /* 手机端：面板改为靠右的 MD3 modal-like surface，避免超出屏幕。 */
      .color-panel {
        top: calc(var(--safe-top) + var(--header-h) + 6px);
        right: 8px;
        width: min(336px, calc(100vw - 16px));
        border-radius: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">

    <div class="spacer"></div>

    <button class="icon-btn desktop-only" id="downloadMdBtn" aria-label="⇩">
      <span class="material-symbols-outlined">download</span>
    </button>
    <button class="icon-btn desktop-only" id="exportHtmlBtn" aria-label="<>">
      <span class="material-symbols-outlined">html</span>
    </button>
    <button class="icon-btn" id="themeToggle" aria-label="☼">
      <span class="material-symbols-outlined">dark_mode</span>
    </button>
    <button class="icon-btn" id="colorToggle" aria-label="◉" aria-expanded="false">
      <span class="material-symbols-outlined">palette</span>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title material-symbols-outlined" aria-hidden="true">notes</span>
        <button class="icon-btn" id="newNoteBtn" type="button" aria-label="＋">
          <span class="material-symbols-outlined">add</span>
        </button>
      </div>

      <div class="folder-bar" id="folderBar"></div>
      <div class="folder-divider"></div>

      <div class="search-wrap">
        <label class="search-box">
          <span class="material-symbols-outlined" style="font-size:20px;">search</span>
          <input id="searchInput" type="search" aria-label="⌕" autocomplete="off" />
        </label>
      </div>

      <div class="notes-list" id="notesList"></div>
    </aside>

    <section class="editor-area">
      <div class="empty-state" id="emptyState">
        <span class="material-symbols-outlined">edit_note</span>
        <button id="emptyNewBtn" type="button" aria-label="＋"><span class="material-symbols-outlined">add</span></button>
      </div>

      <div id="editorContent">
        <div class="editor-toolbar">
          <input id="noteTitle" class="title-input" type="text" aria-label="✎" maxlength="120" />
          <span class="save-status material-symbols-outlined" id="saveStatus" aria-label="✓">cloud_done</span>
          <button class="icon-btn" id="moveNoteBtn" type="button" aria-label="↗">
            <span class="material-symbols-outlined">drive_file_move</span>

          <button class="icon-btn mobile-only" id="downloadMdBtnMobile" aria-label="⇩">
            <span class="material-symbols-outlined">download</span>

          <button class="icon-btn mobile-only" id="exportHtmlBtnMobile" aria-label="<>">
            <span class="material-symbols-outlined">html</span>

        <div class="mode-switcher">
          <button class="mode-btn active" id="editModeBtn" aria-label="✎">
            <span class="material-symbols-outlined" style="font-size:22px;">edit</span>
          </button>
          <button class="mode-btn" id="previewModeBtn" aria-label="◉">

        <div class="panes">
          <div class="pane">

          <div class="divider"></div>

          <div class="pane">

  </main>

  <div class="move-panel" id="movePanel" aria-hidden="true"></div>
  <div class="toast" id="toast"></div>

  <div class="color-panel" id="colorPanel" aria-hidden="true">
    <div class="color-panel-title">
      <button class="icon-btn" id="closeColorPanel" type="button" aria-label="×">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="color-panel-section">
      <div class="color-swatches" id="colorSwatches">
        <button class="color-swatch" type="button" data-color="#6750A4" style="background:#6750A4"></button>
        <button class="color-swatch" type="button" data-color="#3F51B5" style="background:#3F51B5"></button>
        <button class="color-swatch" type="button" data-color="#0077B6" style="background:#0077B6"></button>
        <button class="color-swatch" type="button" data-color="#00897B" style="background:#00897B"></button>
        <button class="color-swatch" type="button" data-color="#2E7D32" style="background:#2E7D32"></button>
        <button class="color-swatch" type="button" data-color="#EF6C00" style="background:#EF6C00"></button>
        <button class="color-swatch" type="button" data-color="#D81B60" style="background:#D81B60"></button>
        <button class="color-swatch" type="button" data-color="#C62828" style="background:#C62828"></button>
      </div>
    </div>

    <div class="color-panel-section">
      <div class="custom-color-row">
        <input id="customColor" type="color" value="#6750A4" aria-label="◉">
        <button class="color-reset" id="resetColor" type="button" aria-label="↺">
          <span class="material-symbols-outlined">restart_alt</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "md3-notes-v2";
      const FOLDER_KEY = "md3-notes-folders-v1";
      const THEME_KEY = "md3-notes-theme";
      const COLOR_KEY = "md3-notes-color";
      const DEFAULT_COLOR = "#6750A4";
      const SAVE_DELAY = 250;

      const $ = (id) => document.getElementById(id);

      const els = {
        html: document.documentElement,
        body: document.body,
        sidebar: $("sidebar"),
        overlay: $("overlay"),
        menuBtn: $("menuBtn"),
        notesList: $("notesList"),
        folderBar: $("folderBar"),
        searchInput: $("searchInput"),
        newNoteBtn: $("newNoteBtn"),
        emptyNewBtn: $("emptyNewBtn"),
        emptyState: $("emptyState"),
        editorContent: $("editorContent"),
        noteTitle: $("noteTitle"),
        editor: $("editor"),
        preview: $("preview"),
        editModeBtn: $("editModeBtn"),
        previewModeBtn: $("previewModeBtn"),
        moveNoteBtn: $("moveNoteBtn"),
        movePanel: $("movePanel"),
        themeToggle: $("themeToggle"),
        colorToggle: $("colorToggle"),
        colorPanel: $("colorPanel"),
        closeColorPanel: $("closeColorPanel"),
        colorSwatches: $("colorSwatches"),
        customColor: $("customColor"),
        resetColor: $("resetColor"),
        downloadMdBtn: $("downloadMdBtn"),
        exportHtmlBtn: $("exportHtmlBtn"),
        downloadMdBtnMobile: $("downloadMdBtnMobile"),
        exportHtmlBtnMobile: $("exportHtmlBtnMobile"),
        saveStatus: $("saveStatus"),
        toast: $("toast")
      };

      // 防御性修复：如果某些 Android WebView/浏览器把按钮节点样式异常处理，
      // 自动补一个明确可见的“＋ 新建”按钮，并绑定同一个 createNote。
      function ensureNewNoteButton() {
        if (!els.sidebar) return;
        let btn = els.newNoteBtn;
        if (!btn) {
          btn = document.createElement("button");
          btn.id = "newNoteBtn";
          btn.className = "icon-btn";
          btn.type = "button";
          btn.setAttribute("aria-label", "＋");
          btn.innerHTML = '<span class="material-symbols-outlined">add</span>';
          (els.sidebar.querySelector(".sidebar-head") || els.sidebar).prepend(btn);
          els.newNoteBtn = btn;
        }
        btn.style.setProperty("display", "inline-flex", "important");
        btn.style.setProperty("visibility", "visible", "important");
        btn.style.setProperty("opacity", "1", "important");
      }

      let notes = loadNotes();
      let folders = loadFolders();
      let currentFolderId = null;
      let currentId = null;
      let saveTimer = null;
      let toastTimer = null;

      function loadNotes() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("md3-notes");
          const data = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(data)) return [];
          return data.map((note) => ({
            id: String(note.id || crypto.randomUUID?.() || Date.now()),
            title: String(note.title || "•"),
            content: String(note.content || ""),
            folderId: note.folderId ? String(note.folderId) : null,
            updated: Number(note.updated) || Date.now()
          }));
        } catch {
          return [];
        }
      }

      function loadFolders() {
        try {
          const raw = localStorage.getItem(FOLDER_KEY);
          const data = raw ? JSON.parse(raw) : [];
          return Array.isArray(data) ? data.map(f => ({
            id: String(f.id || createId()),
            name: String(f.name || "Folder")
          })) : [];
        } catch { return []; }
      }

      function saveFolders() {
        try { localStorage.setItem(FOLDER_KEY, JSON.stringify(folders)); } catch {}
      }

      function createFolder() {
        const name = prompt("Folder");
        if (!name || !name.trim()) return;
        const folder = { id: createId(), name: name.trim().slice(0, 80) };
        folders.push(folder);
        saveFolders();
        currentFolderId = folder.id;
        renderFolders();
        renderNotesList();
      }

      function deleteFolder(id) {
        const folder = folders.find(f => f.id === id);
        if (!folder) return;
        if (!confirm("Delete folder? Notes will move to root.")) return;
        notes.forEach(n => { if (n.folderId === id) n.folderId = null; });
        folders = folders.filter(f => f.id !== id);
        saveFolders();
        saveNotes();
        if (currentFolderId === id) currentFolderId = null;
        renderFolders();
        renderNotesList();
      }

      function renderFolders() {
        if (!els.folderBar) return;
        els.folderBar.replaceChildren();
        const root = document.createElement("button");
        root.className = "folder-item" + (currentFolderId === null ? " active" : "");
        root.type = "button"; root.dataset.folder = "root"; root.title = "Root";
        root.innerHTML = '<span class="material-symbols-outlined">home</span>';
        els.folderBar.appendChild(root);
        for (const folder of folders) {
          const b = document.createElement("button");
          b.className = "folder-item" + (folder.id === currentFolderId ? " active" : "");
          b.type = "button"; b.dataset.folder = folder.id;
          b.title = folder.name; b.setAttribute("aria-label", folder.name);
          b.innerHTML = '<span class="material-symbols-outlined">folder</span>';
          els.folderBar.appendChild(b);
        }
        const add = document.createElement("button");
        add.className = "folder-item add"; add.type = "button";
        add.title = "New folder"; add.setAttribute("aria-label", "New folder");
        add.innerHTML = '<span class="material-symbols-outlined">create_new_folder</span>';
        els.folderBar.appendChild(add);

        if (currentFolderId !== null) {
          const del = document.createElement("button");
          del.className = "folder-item delete"; del.type = "button";
          del.dataset.deleteFolder = currentFolderId;
          del.title = "Delete folder"; del.setAttribute("aria-label", "Delete folder");
          del.innerHTML = '<span class="material-symbols-outlined">delete</span>';
          els.folderBar.appendChild(del);
        }
      }

      function closeMovePanel() {
        if (!els.movePanel) return;
        els.movePanel.classList.remove("open");
        els.movePanel.setAttribute("aria-hidden", "true");
      }

      function openMovePanel() {
        if (!els.movePanel || !currentId) return;
        els.movePanel.replaceChildren();
        const note = notes.find(n => n.id === currentId);
        if (!note) return;
        const targets = [{ id: null, icon: "home", name: "Root" }, ...folders.map(f => ({ id: f.id, icon: "folder", name: f.name }))];
        targets.forEach(target => {
          const b = document.createElement("button");
          b.className = "move-option" + ((note.folderId || null) === target.id ? " active" : "");
          b.type = "button";
          b.dataset.folder = target.id || "root";
          b.innerHTML = `<span class="material-symbols-outlined">${target.icon}</span><span></span>`;
          b.lastElementChild.textContent = target.name;
          els.movePanel.appendChild(b);
        });
        els.movePanel.classList.add("open");
        els.movePanel.setAttribute("aria-hidden", "false");
      }

      function moveCurrentNote(folderId) {
        const note = notes.find(n => n.id === currentId);
        if (!note) return;
        note.folderId = folderId === "root" ? null : folderId;
        note.updated = Date.now();
        saveNotes();
        currentFolderId = note.folderId;
        renderFolders();
        renderNotesList();
        closeMovePanel();
      }

      function saveNotes() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
          els.saveStatus.textContent = "cloud_done";
        } catch {
          els.saveStatus.textContent = "cloud_off";
          showToast("浏览器存储空间不足");
        }
      }

      function debounceSave() {
        els.saveStatus.textContent = "sync";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveCurrentNote, SAVE_DELAY);
      }

      function saveCurrentNote() {
        if (!currentId) return;
        const note = notes.find(n => n.id === currentId);
        if (!note) return;

        note.title = els.noteTitle.value.trim() || "•";
        note.content = els.editor.value;
        note.updated = Date.now();

        saveNotes();
        renderNotesList();
      }

      function createId() {
        return crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      function createNote() {
        const now = Date.now();
        const note = {
          id: createId(),
          title: "•",
          content: "",
          folderId: currentFolderId,
          updated: now
        };

        notes.push(note);
        saveNotes();
        openNote(note.id);
        closeSidebar();

        requestAnimationFrame(() => {
          els.noteTitle.focus();
          els.noteTitle.select();
        });
      }

      function openNote(id) {
        const note = notes.find(n => n.id === id);
        if (!note) return;

        currentId = id;
        currentFolderId = note.folderId || null;
        renderFolders();
        els.noteTitle.value = note.title;
        els.editor.value = note.content;

        els.emptyState.style.display = "none";
        els.editorContent.style.display = "flex";
        els.saveStatus.textContent = "cloud_done";

        setMode("edit");
        updatePreview();
        renderNotesList();
      }

      function deleteNote(id) {
        const note = notes.find(n => n.id === id);
        if (!note) return;

        if (!confirm(`确定删除「${note.title || "•"}」？`)) return;

        notes = notes.filter(n => n.id !== id);
        saveNotes();

        if (currentId === id) {
          const next = [...notes].sort((a, b) => b.updated - a.updated)[0];
          currentId = null;

          if (next) {
            openNote(next.id);
          } else {
            els.emptyState.style.display = "flex";
            els.editorContent.style.display = "none";
          }
        }

        renderNotesList();
        showToast("笔记已删除");
      }

      function renderNotesList() {
        const query = els.searchInput.value.trim().toLowerCase();

        const sorted = [...notes]
          .sort((a, b) => b.updated - a.updated)
          .filter(note => {
            if ((note.folderId || null) !== currentFolderId) return false;
            if (!query) return true;
            return `${note.title} ${note.content}`.toLowerCase().includes(query);
          });

        els.notesList.replaceChildren();

        if (!sorted.length) {
          const empty = document.createElement("div");
          empty.className = "empty-list";
          empty.innerHTML = `<span class="material-symbols-outlined">${query ? "search_off" : "notes"}</span>`;
          els.notesList.appendChild(empty);
          return;
        }

        const fragment = document.createDocumentFragment();

        for (const note of sorted) {
          const item = document.createElement("div");
          item.className = "note-item" + (note.id === currentId ? " active" : "");
          item.dataset.id = note.id;
          item.draggable = true;

          const icon = document.createElement("span");
          icon.className = "material-symbols-outlined";
          icon.style.fontSize = "20px";
          icon.style.opacity = ".7";
          icon.textContent = "description";

          const main = document.createElement("div");
          main.className = "note-main";

          const title = document.createElement("div");
          title.className = "note-title";
          title.textContent = note.title || "•";

          const time = document.createElement("div");
          time.className = "note-time";
          time.textContent = formatTime(note.updated);

          main.append(title, time);

          const del = document.createElement("button");
          del.className = "delete-btn";
          del.type = "button";
          del.title = "删除笔记";
          del.setAttribute("aria-label", "删除笔记");

          const delIcon = document.createElement("span");
          delIcon.className = "material-symbols-outlined";
          delIcon.style.fontSize = "20px";
          delIcon.textContent = "close";
          del.appendChild(delIcon);

          item.append(icon, main, del);
          fragment.appendChild(item);
        }

        els.notesList.appendChild(fragment);
      }

      function formatTime(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();

        if (date.toDateString() === now.toDateString()) {
          return date.toLocaleTimeString("zh-CN", {
            hour: "2-digit",
            minute: "2-digit"
          });
        }

        return date.toLocaleDateString("zh-CN", {
          month: "2-digit",
          day: "2-digit"
        });
      }

      function setMode(mode) {
        const preview = mode === "preview";
        els.body.classList.toggle("preview-mode", preview);
        els.editModeBtn.classList.toggle("active", !preview);
        els.previewModeBtn.classList.toggle("active", preview);

        if (preview) updatePreview();
      }

      function updatePreview() {
        if (typeof marked === "undefined") {
          els.preview.textContent = els.editor.value;
          return;
        }

        els.preview.innerHTML = marked.parse(els.editor.value || "", {
          gfm: true,
          breaks: true,
          html: false
        });
      }

      function getSafeFilename(title) {
        return (title || "untitled")
          .replace(/[\\/:*?"<>|]/g, "_")
          .trim()
          .slice(0, 80) || "untitled";
      }

      function downloadBlob(content, filename, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function downloadMd() {
        if (!currentId) return;

        saveCurrentNote();

        const title = els.noteTitle.value.trim() || "•";
        downloadBlob(
          els.editor.value,
          `${getSafeFilename(title)}.md`,
          "text/markdown;charset=utf-8"
        );

        showToast("Markdown 已导出");
      }

      function exportHtml() {
        if (!currentId) return;

        saveCurrentNote();

        const title = els.noteTitle.value.trim() || "•";
        const markdown = els.editor.value || "";
        const rendered = typeof marked === "undefined"
          ? escapeHtml(markdown).replace(/\n/g, "<br>")
          : marked.parse(markdown, { gfm: true, breaks: true, html: false });

        const exportTheme = els.html.getAttribute("data-theme") || "light";
        const exportAccent = els.html.style.getPropertyValue("--accent").trim() || DEFAULT_COLOR;
        const exportTime = new Date().toLocaleString("zh-CN");

        /*
          关键修复：
          不在这里直接写脚本结束标签，否则 HTML 解析器会把它当成
          当前主页面 script 的结束标签。
        */
        const openScript = "<" + "script>";
        const closeScript = "<" + "/script>";

        const documentHTML = `<!DOCTYPE html>
<html lang="zh-CN" data-theme="${exportTheme}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>

  --primary:${exportAccent};--bg:#FEF7FF;--surface:#F7F2FA;--surface2:#F3EDF7;
  --text:#1D1B20;--muted:#49454F;--outline:#CAC4D0;
}
[data-theme="dark"]{
  --primary:#D0BCFF;--bg:#141218;--surface:#1D1B20;--surface2:#211F26;
  --text:#E6E0E9;--muted:#CAC4D0;--outline:#49454F;
}

  position:sticky;top:0;z-index:2;height:64px;padding:0 18px;
  display:flex;align-items:center;gap:12px;background:var(--surface2);
  border-bottom:1px solid var(--outline)
}

  width:44px;height:44px;border:0;border-radius:50%;background:transparent;
  color:var(--muted);font-size:22px;cursor:pointer
}

  overflow:hidden;background:var(--surface);border-radius:28px;
  box-shadow:0 1px 3px rgba(0,0,0,.18)
}

</head>
<body>
<header class="topbar">
  <div class="logo">✎</div>
  <div class="title" aria-hidden="true"></div>
  <button id="themeBtn" aria-label="☾">☾</button>
</header>
<main>
  <article class="card">
    <header class="header">
      <h1>${escapeHtml(title)}</h1>
    </header>
    <div class="article">${rendered}</div>
  </article>
</main>
${openScript}
const root=document.documentElement;
const btn=document.getElementById("themeBtn");

  root.setAttribute("data-theme",theme);
  btn.textContent=theme==="dark"?"☀":"☾";
  try{localStorage.setItem("md3-export-theme",theme)}catch(e){}

        downloadBlob(
          documentHTML,

        );

        showToast("HTML 已导出");
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function isHexColor(value) {
        return /^#[0-9a-fA-F]{6}$/.test(String(value || ""));
      }

      function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
      }

      function setAccentColor(color, persist = true) {
        if (!isHexColor(color)) color = DEFAULT_COLOR;
        const { r, g, b } = hexToRgb(color);
        const lightness = (Math.max(r, g, b) + Math.min(r, g, b)) / 510;

        // 深色主题把主色自动提亮一点，避免深色按钮上的文字看不清。
        const darkPrimary = `rgb(${Math.round(r + (255-r)*0.38)}, ${Math.round(g + (255-g)*0.38)}, ${Math.round(b + (255-b)*0.38)})`;
        els.html.style.setProperty("--accent", color);
        els.html.style.setProperty("--primary-light", color);
        els.html.style.setProperty("--primary-dark", darkPrimary);
        els.html.style.setProperty("--accent-lightness", lightness.toFixed(3));

        // 通过主题覆盖，让亮/暗模式都能使用同一套自定义颜色。
        if (els.html.getAttribute("data-theme") === "dark") {
          els.html.style.setProperty("--primary", darkPrimary);
          els.html.style.setProperty("--primary-container", `color-mix(in srgb, ${darkPrimary} 42%, #4F378B)`);
          els.html.style.setProperty("--on-primary", "#24113F");
          els.html.style.setProperty("--on-primary-container", "#F5EDFF");
        } else {
          els.html.style.setProperty("--primary", color);
          els.html.style.setProperty("--primary-container", `color-mix(in srgb, ${color} 18%, #FFFFFF)`);
          els.html.style.setProperty("--on-primary", "#FFFFFF");
          els.html.style.setProperty("--on-primary-container", color);
        }

        if (els.customColor) els.customColor.value = color;
        els.colorSwatches?.querySelectorAll(".color-swatch").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.color?.toUpperCase() === color.toUpperCase());
        });

        if (persist) {
          try { localStorage.setItem(COLOR_KEY, color); } catch {}
        }
      }

      function initAccentColor() {
        let color = DEFAULT_COLOR;
        try {
          const saved = localStorage.getItem(COLOR_KEY);
          if (isHexColor(saved)) color = saved;
        } catch {}
        setAccentColor(color, false);
      }

      function openColorPanel() {
        els.colorPanel.classList.add("open");
        els.colorPanel.setAttribute("aria-hidden", "false");
        els.colorToggle.setAttribute("aria-expanded", "true");
      }

      function closeColorPanel() {
        els.colorPanel.classList.remove("open");
        els.colorPanel.setAttribute("aria-hidden", "true");
        els.colorToggle.setAttribute("aria-expanded", "false");
      }

      function toggleColorPanel() {
        if (els.colorPanel.classList.contains("open")) closeColorPanel();
        else openColorPanel();
      }

      function toggleTheme() {
        const current = els.html.getAttribute("data-theme") || "light";
        const next = current === "dark" ? "light" : "dark";

        els.html.setAttribute("data-theme", next);
        localStorage.setItem(THEME_KEY, next);

        els.themeToggle.querySelector(".material-symbols-outlined").textContent =
          next === "dark" ? "light_mode" : "dark_mode";

        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", next === "dark" ? "#211F26" : "#F7F2FA");
        setAccentColor(els.html.style.getPropertyValue("--accent").trim() || DEFAULT_COLOR, false);
      }

      function initTheme() {
        let theme = "light";

        try {
          const saved = localStorage.getItem(THEME_KEY);
          if (saved === "light" || saved === "dark") {
            theme = saved;
          } else if (window.matchMedia?.("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch {}

        els.html.setAttribute("data-theme", theme);
        els.themeToggle.querySelector(".material-symbols-outlined").textContent =
          theme === "dark" ? "light_mode" : "dark_mode";
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#211F26" : "#F7F2FA");
        initAccentColor();
      }

      function openSidebar() {
        els.sidebar.classList.add("open");
        els.overlay.classList.add("show");
      }

      function closeSidebar() {
        els.sidebar.classList.remove("open");
        els.overlay.classList.remove("show");
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        const icon = /失败|错误/.test(message) ? "error" : /删除/.test(message) ? "delete" : /恢复/.test(message) ? "restart_alt" : /导出/.test(message) ? "download_done" : /切换/.test(message) ? "palette" : "done";
        els.toast.innerHTML = `<span class="material-symbols-outlined">${icon}</span>`;
        els.toast.classList.add("show");
        toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1200);
      }

      // 事件委托：笔记再多也只需要一个 click 监听器。
      els.notesList.addEventListener("click", (event) => {
        const item = event.target.closest(".note-item");
        if (!item) return;

        const id = item.dataset.id;
        if (event.target.closest(".delete-btn")) {
          deleteNote(id);
          return;
        }

        openNote(id);
        closeSidebar();
      });

      let draggedNoteId = null;

      els.notesList.addEventListener("dragstart", (event) => {
        const item = event.target.closest(".note-item");
        if (!item) return;
        draggedNoteId = item.dataset.id;
        item.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", draggedNoteId);
      });

      els.notesList.addEventListener("dragend", (event) => {
        const item = event.target.closest(".note-item");
        if (item) item.classList.remove("dragging");
        draggedNoteId = null;
        els.folderBar.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
      });

      els.folderBar.addEventListener("dragover", (event) => {
        const item = event.target.closest(".folder-item");
        if (!item || item.classList.contains("add")) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        els.folderBar.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
        item.classList.add("drag-over");
      });

      els.folderBar.addEventListener("dragleave", (event) => {
        const item = event.target.closest(".folder-item");
        if (item && !item.contains(event.relatedTarget)) item.classList.remove("drag-over");
      });

      els.folderBar.addEventListener("drop", (event) => {
        const item = event.target.closest(".folder-item");
        if (!item || item.classList.contains("add")) return;
        event.preventDefault();
        const noteId = draggedNoteId || event.dataTransfer.getData("text/plain");
        const note = notes.find(n => n.id === noteId);
        if (!note) return;
        note.folderId = item.dataset.folder === "root" ? null : item.dataset.folder;
        note.updated = Date.now();
        saveNotes();
        currentFolderId = note.folderId;
        renderFolders();
        renderNotesList();
        if (currentId === note.id) openNote(note.id);
      });

      els.folderBar.addEventListener("click", (event) => {
        const item = event.target.closest(".folder-item");
        if (!item) return;
        if (item.classList.contains("add")) { createFolder(); return; }
        if (item.classList.contains("delete")) { deleteFolder(item.dataset.deleteFolder); return; }
        if (item.dataset.folder === "root") { currentFolderId = null; }
        else {
          const folder = folders.find(f => f.id === item.dataset.folder);
          if (!folder) return;
          currentFolderId = folder.id;
        }
        renderFolders();
        renderNotesList();
      });

      els.moveNoteBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        if (els.movePanel.classList.contains("open")) closeMovePanel();
        else openMovePanel();
      });
      els.movePanel.addEventListener("click", (event) => {
        const option = event.target.closest(".move-option");
        if (option) moveCurrentNote(option.dataset.folder);
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest("#movePanel") && !event.target.closest("#moveNoteBtn")) closeMovePanel();
      });

      els.menuBtn.addEventListener("click", openSidebar);
      els.overlay.addEventListener("click", closeSidebar);

      ensureNewNoteButton();
      els.newNoteBtn.addEventListener("click", createNote);
      els.emptyNewBtn.addEventListener("click", createNote);

      els.searchInput.addEventListener("input", renderNotesList);

      els.themeToggle.addEventListener("click", toggleTheme);
      els.colorToggle.addEventListener("click", toggleColorPanel);
      els.closeColorPanel.addEventListener("click", closeColorPanel);
      els.colorSwatches.addEventListener("click", (event) => {
        const swatch = event.target.closest(".color-swatch");
        if (!swatch) return;
        setAccentColor(swatch.dataset.color);
        showToast("主色已切换");
      });
      els.customColor.addEventListener("input", (event) => {
        setAccentColor(event.target.value);
      });
      els.resetColor.addEventListener("click", () => {
        setAccentColor(DEFAULT_COLOR);
        showToast("已恢复默认紫色");
      });
      document.addEventListener("click", (event) => {
        if (!els.colorPanel.classList.contains("open")) return;
        if (els.colorPanel.contains(event.target) || els.colorToggle.contains(event.target)) return;
        closeColorPanel();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeColorPanel();
      });

      els.editModeBtn.addEventListener("click", () => setMode("edit"));
      els.previewModeBtn.addEventListener("click", () => setMode("preview"));

      els.editor.addEventListener("input", () => {
        updatePreview();
        debounceSave();
      });

      els.noteTitle.addEventListener("input", debounceSave);

      els.downloadMdBtn.addEventListener("click", downloadMd);
      els.exportHtmlBtn.addEventListener("click", exportHtml);
      els.downloadMdBtnMobile.addEventListener("click", downloadMd);
      els.exportHtmlBtnMobile.addEventListener("click", exportHtml);

      // Tab 缩进 Markdown，更适合手机/桌面写代码块。
      els.editor.addEventListener("keydown", (event) => {
        if (event.key === "Tab") {
          event.preventDefault();
          const start = els.editor.selectionStart;
          const end = els.editor.selectionEnd;
          els.editor.setRangeText("  ", start, end, "end");
          els.editor.dispatchEvent(new Event("input", { bubbles: true }));
        }

        const modifier = event.ctrlKey || event.metaKey;
        if (modifier && event.key.toLowerCase() === "s") {
          event.preventDefault();
          saveCurrentNote();
          showToast("已保存");
        }
      });

      els.noteTitle.addEventListener("keydown", (event) => {
        const modifier = event.ctrlKey || event.metaKey;
        if (modifier && event.key.toLowerCase() === "s") {
          event.preventDefault();
          saveCurrentNote();
          showToast("已保存");
        }
      });

      // 页面关闭/切后台前再保存一次。
      window.addEventListener("beforeunload", () => {
        clearTimeout(saveTimer);
        saveCurrentNote();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          clearTimeout(saveTimer);
          saveCurrentNote();
        }
      });

      initTheme();
      renderNotesList();

      if (notes.length) {
        const latest = [...notes].sort((a, b) => b.updated - a.updated)[0];
        openNote(latest.id);
      }
    })();
  </script>
</body>
